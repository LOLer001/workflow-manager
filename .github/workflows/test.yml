name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate repository
        run: python -B scripts/validate_repository.py
      - name: Run full test suite
        run: python -B -m unittest discover -s plugins/workflow-manager/tests -p "test_*.py" -v

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository
        run: python -B scripts/validate_repository.py
      - name: Run full native Windows suite
        working-directory: plugins/workflow-manager
        run: python -B -m unittest discover -s tests -p "test_*.py" -v
