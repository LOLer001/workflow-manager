name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate repository
        run: python scripts/validate_repository.py
      - name: Run full test suite
        run: python -m unittest discover -s plugins/workflow-manager/tests -p "test_*.py" -v

  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run nine native Windows tests
        working-directory: plugins/workflow-manager
        run: py -3 -m unittest -v tests.test_windows_hook
